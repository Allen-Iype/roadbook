<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list — Roadbook</title>
<meta name="robots" content="noindex">
<style>
:root { --paper:#f5f2e8; --land:#efece2; --ink:#26251f; --ink-2:#6e6a5e; --rule:#c9c3b2; }
@font-face { font-family:"Source Serif 4"; src:url("fonts/source-serif-4/latin-600-normal.woff2") format("woff2"); font-weight:600; font-display:swap; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.65; }
main { max-width:38rem; margin:0 auto; padding:4rem 1.25rem; }
.wordmark { font-family:"Source Serif 4","Palatino Linotype",Georgia,serif; font-weight:600; font-size:1.4rem; padding-bottom:0.9rem; border-bottom:1px solid var(--ink); }
h1 { font-family:"Source Serif 4","Palatino Linotype",Georgia,serif; font-weight:600; font-size:1.8rem; margin-top:2.2rem; }
p { margin-top:0.9rem; max-width:54ch; }
.fine { font-size:0.85rem; color:var(--ink-2); }
a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px; }
a:hover { text-decoration-color:var(--ink); }
a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <p class="wordmark">Roadbook</p>
  <h1>You're on the list.</h1>
  <p>When a slot opens, one email arrives with your private link and
  credential — that is the only mail this list ever sends.</p>
  <p class="fine">Change your mind? Reply to that email, or ask any time,
  and your line is deleted.</p>
  <p style="margin-top:1.6rem"><a href="/">Back to the page</a></p>
</main>
</body>
</html>
