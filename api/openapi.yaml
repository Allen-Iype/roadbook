openapi: 3.0.3
info:
  title: Roadbook API
  description: >
    Read candidates and record decisions. This file is the contract (CLAUDE.md
    invariant 10): the Go server interface and the TypeScript client are both
    generated from it and never hand-written. Import and detection are CLI
    operations in phase 1 and do not appear here.
  version: 0.1.0

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Readiness check
      description: >
        Answers 200 only when a database round-trip succeeds — a listening
        socket with a dead database behind it is exactly the not-ready state
        the check exists to catch (phase 5 BRIEF §3A). The compose healthcheck
        gates dependent services on this.
      responses:
        "200":
          description: Service is up and the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /imports:
    get:
      operationId: listImports
      summary: Every import attempt, newest first
      description: >
        Import bookkeeping (phase 5 BRIEF §3B): each attempt is recorded
        before parsing and finalised as completed or failed, so a failure is
        visible in the product. detected_format is the sniffer's stable
        format label — evidence that stays queryable while user-facing error
        prose gets reworded.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: All import attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
    post:
      operationId: uploadImport
      summary: Upload a Timeline export and import it
      description: >
        The browser import path (phase 7 BRIEF §§1.1–1.3, §3A). The file
        streams to the instance's uploads directory — named by its SHA-256,
        retained after import (the export may be irreplaceable: rawSignals
        windows expire at the source) — and the head is sniffed before the
        request returns, so a wrong file is rejected synchronously with its
        stable format label. 202 means accepted: the imports row exists with
        status "running" and the parse continues in the background; poll
        GET /imports/{id}. On success detection runs automatically with
        default parameters (recorded per run as ever), reported via
        detect_status on the same resource. One import runs at a time; a
        concurrent attempt gets 409. Re-uploading identical bytes stores no
        second file and re-imports idempotently (an all-skipped row).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The Timeline export.
                label:
                  type: string
                  description: >
                    Provenance label; defaults to the uploaded file's name
                    (the source_label convention).
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "202":
          description: >
            Accepted — the upload is on disk and the import is running.
            The returned id is the polling handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "400":
          description: >
            The sniffer recognised a wrong input. detected_format carries
            the stable label so the front door can redirect to the right
            walkthrough instead of dead-ending; the rejected file is not
            retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRejection"
        "409":
          description: An import is already running on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The upload exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /imports/photos:
    post:
      operationId: uploadPhotoImport
      summary: Upload a batch of photos as an import source
      description: >
        The photo-ingestion path (phase 11 BRIEF §4C). Repeatable `file`
        parts — photos (JPEG or HEIC) and their Takeout JSON sidecars —
        stream through metadata extraction one at a time: each usable photo
        becomes one position fix in the observation stratum plus a photo
        record (and a thumbnail where the format is decodable); the original
        bytes are discarded, never retained (§4D — the records are the
        durable product, and this is the privacy-shaped answer). Unlike the
        Timeline path there is no all-or-nothing rule: a camera roll is many
        files, so the response carries a per-file verdict and the import row
        records what the batch contributed. The import itself completes
        before the response; detection then runs in the background with
        default parameters, reported via detect_status on GET /imports/{id}.
        One import runs at a time; a concurrent attempt gets 409.
        Re-uploading the same photos is idempotent — no new fixes, no new
        records, no second thumbnail.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Photos and sidecars; repeatable.
                label:
                  type: string
                  description: Provenance label; defaults to "photo upload".
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "202":
          description: >
            The batch is imported (the import row is already completed) and
            automatic detection is running; the import id is the polling
            handle for detect_status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoImportResult"
        "400":
          description: The request carried no file parts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An import is already running on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /imports/{id}:
    get:
      operationId: getImport
      summary: One import attempt, by id
      description: >
        The polling endpoint for an upload in progress (phase 7 BRIEF §1.2):
        status running → completed/failed, then detect_status for the
        automatic detection that follows a successful upload import.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The import attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          description: No such import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates:
    get:
      operationId: listCandidates
      summary: The latest detection run's candidates, with decision state attached
      description: >
        Candidates come from the most recent detection run. Each carries its
        matched decision, if any; decisions no current candidate matched are
        returned separately as orphans, because a decision is never silently
        lost (BRIEF §3.1). When no detection run exists yet, `run` is omitted,
        `candidates` is empty, and every decision is an orphan.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Candidates and orphaned decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateList"

  /candidates/decisions:
    post:
      operationId: decideCandidatesBulk
      summary: Decide several candidates in one atomic request
      description: >
        Bulk triage (phase 11 §6.1, the first pilot report's friction):
        confirm or dismiss many candidates at once. All-or-nothing — every
        item is validated (a confirm carries a non-empty name; every id is
        in the latest run) and applied in one transaction, or nothing is
        recorded and the error says why. Anchoring and re-decide semantics
        are exactly the single-decision endpoint's, per item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDecisionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every decision applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDecisionResult"
        "400":
          description: >
            Invalid request — empty list, an unknown action, a confirm
            without a name, or the same candidate twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            One or more ids are not in the latest run (stale after
            re-detection). Nothing was applied; the message names them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/journey:
    get:
      operationId: getCandidateJourney
      summary: The journey reconstruction for a candidate of the latest run
      description: >
        Assembles the candidate's span into an ordered list of legs, each
        observed or a gap — never one undifferentiated line (CLAUDE.md
        invariant 5); every leg carries its kind so confidence survives to the
        renderer (invariant 8). Straight lines only in phase 2: gap_kind is
        always "unknown" until phase 3 classifies road and air gaps. The
        journey is derived on demand from immutable observations, and the
        response echoes the parameters that produced it (invariant 3).
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The assembled journey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/name-suggestion:
    get:
      operationId: suggestCandidateName
      summary: A proposed name for the candidate's adventure
      description: >
        One-shot lookup on the destination coordinate through the configured
        Suggester (BRIEF §1.7) — the null implementation by default, a
        reverse geocoder when enabled at serve time. The suggestion is
        prefill for the confirm step's name input and is never applied
        automatically. An absent name is a real answer: nothing to suggest.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The suggestion, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameSuggestion"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The configured suggester could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/decision:
    post:
      operationId: decideCandidate
      summary: Confirm or dismiss a candidate
      description: >
        Records a decision on a candidate of the latest run, snapshotting the
        candidate's span and destination as the decision's anchor. If the
        candidate already has a matched decision, that decision is updated in
        place and its anchor refreshed; otherwise a new decision is created.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The decision as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid request — confirming without a name, or an unknown action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/photos:
    post:
      operationId: uploadCandidatePhotos
      summary: Upload photos (and Takeout sidecars) to a confirmed adventure
      description: >
        Multipart upload through the one API boundary (BRIEF §1.3): images
        and optional Google Photos Takeout JSON sidecars in a single request.
        Only the thumbnail and extracted metadata are stored; original bytes
        are discarded after extraction and never written to disk. Results
        are per-file — one unsupported file never fails the batch. Re-upload
        of identical bytes reports "duplicate" and stores nothing (content-
        hash idempotency, the imports precedent). Sidecars pair with their
        image by filename, falling back to their title field.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One result per uploaded file, in upload order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResults"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The candidate has no confirmed decision. Photos attach to
            adventures — confirmed candidates — because they are user data
            and must not attach to disposable rows (BRIEF §3A).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listCandidatePhotos
      summary: The photos of a candidate's confirmed adventure
      description: >
        Photos attached to the decision matched to this candidate. An empty
        list for a confirmed adventure with no uploads; 409 when the
        candidate has no confirmed decision.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The photos, in upload order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The candidate has no confirmed decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/import-photos:
    get:
      operationId: listCandidateImportPhotos
      summary: Photo-import records whose capture falls in this candidate's span
      description: >
        The photo records (phase 11 §4D) whose capture instant lies inside
        the candidate's span, joined at read time and never stored against
        the candidate (DECISIONS 2026-08-26): records ride imports, so
        re-detection cannot orphan them and there is nothing to migrate.
        Available for any candidate of the latest run — records are facts
        about the window, and seeing them helps triage as much as it
        decorates a confirmed adventure. Placement fields are derived
        against the same assembled journey the page draws, exactly as for
        attached photos.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The records, in capture order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPhotoList"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /import-photos/{id}/thumbnail:
    get:
      operationId: getImportPhotoThumbnail
      summary: The stored thumbnail of a photo-import record
      description: >
        JPEG bytes from the shared thumbnail store, metadata-stripped like
        every thumbnail. 404 both for an unknown record and for a record
        with no thumbnail (HEIC: metadata readable at ingest, pixels not
        decodable — thumb_w/thumb_h are 0 on the record).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such record, or the record has no thumbnail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /photos/{id}/thumbnail:
    get:
      operationId: getPhotoThumbnail
      summary: The stored thumbnail image
      description: >
        JPEG bytes, re-encoded pixels only — the thumbnailer strips all
        embedded metadata, so this file carries no position or timestamp
        (BRIEF §1.2). The browser reaches this through the Next.js proxy
        route handler, never directly.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /photos/{id}:
    delete:
      operationId: deletePhoto
      summary: Delete one photo
      description: >
        Removes the row, then the thumbnail file — in that order, so a
        mid-failure leaves unreachable garbage rather than a broken image
        (BRIEF §3B). User-initiated only; nothing automated deletes photos.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Deleted.
        "404":
          description: No such photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /candidates/{id}/shares:
    post:
      operationId: createShareLink
      summary: Mint a share link for a confirmed adventure
      description: >
        A share link is a capability URL (phase 13 BRIEF §1): the token IS
        the permission. Anyone holding it can read this one adventure —
        map, legs with their kinds, day narrative, countries, and photos of
        both provenances — signed in or not, on an authless instance or a
        hosted one. The raw token appears in this response once; the
        server keeps only its hash (the sessions rule), so a link that is
        lost is replaced by a new one, never recovered. The link is tied to
        the adventure's decision and survives re-detection through the
        recomputed match.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: The link, with its token — shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkCreated"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The candidate has no confirmed decision — only confirmed adventures are shareable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listShareLinks
      summary: The live share links of a confirmed adventure
      description: >
        Live links only — a revoked link is gone, not listed as revoked.
        Tokens are never returned here (hash-only storage); each entry is
        identified by id and creation time, which is what revocation
        takes.
      parameters:
        - name: id
          in: path
          required: true
          description: Candidate id from the latest run.
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The links, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkList"
        "404":
          description: No such candidate in the latest run (stale id after re-detection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The candidate has no confirmed decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shares/{id}:
    delete:
      operationId: revokeShareLink
      summary: Revoke one share link
      description: >
        Revocation is a DELETE (the sessions rule): the token stops
        resolving immediately and the shared page answers 404 from the
        next request. Only the link's owner can revoke it; another user's
        link id is exactly as absent as an unknown one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Revoked.
        "404":
          description: No such link of the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shared/{token}:
    get:
      operationId: getSharedAdventure
      summary: The read-only view a share link opens
      description: >
        The public read path (phase 13 BRIEF §3C): no session is consulted
        — the token is the credential, and this operation is exempt from
        the sign-in wall in every mode. It resolves the token to its
        decision, requires that decision to be confirmed and matched to a
        candidate of the owner's latest run, and answers with the same
        assembled journey the owner's own page draws: every leg carries its
        kind (invariants 5 and 8 apply to strangers most of all), countries,
        mode breakdown, and photos of both provenances with their
        placements. Unknown, revoked, and currently-unreachable links all
        answer the same 404 — a link that does not open tells nothing
        about why. The response carries X-Robots-Tag noindex; the page
        that renders it does too.
      parameters:
        - name: token
          in: path
          required: true
          description: The raw token from the link.
          schema:
            type: string
      responses:
        "200":
          description: The shared adventure.
          headers:
            X-Robots-Tag:
              schema: {type: string}
              description: Always "noindex, nofollow".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedAdventure"
        "404":
          description: This link does not open anything.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shared/{token}/photos/{id}/thumbnail:
    get:
      operationId: getSharedPhotoThumbnail
      summary: Thumbnail of an attached photo, by share token
      description: >
        Session-exempt like the shared view. The photo must belong to the
        adventure the token opens; any other photo id is 404 — the token
        grants exactly one adventure, never the photo id space.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: The link does not open, or the photo is not on the shared adventure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shared/{token}/import-photos/{id}/thumbnail:
    get:
      operationId: getSharedImportPhotoThumbnail
      summary: Thumbnail of a photo-import record, by share token
      description: >
        Session-exempt like the shared view. The record must be one the
        shared adventure lists (its capture inside the adventure's span,
        the owner's own record); anything else is 404, as is a record
        with no thumbnail (HEIC).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: The link does not open, the record is not on the shared adventure, or it has no thumbnail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    delete:
      operationId: deleteMyData
      summary: Delete everything of mine
      description: >
        Self-serve deletion (phase 13 BRIEF §1 "Data lifecycle"): every row
        the requesting user owns — imports and their observations, runs and
        candidates, decisions, photos and photo records, share links,
        sessions — in one transaction, then the files no remaining row of
        anyone's references (thumbnails, retained uploads). On a multi-user
        instance the account itself is forgotten too and the session cookie
        is cleared; the next sign-in starts from nothing. On the authless
        instance the single user's data goes and the instance is empty
        again, exactly as after a fresh `docker compose up`. Refused while an
        import is running (409) — the import would write rows after the
        deletion.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Deleted; the counts are what went.
          headers:
            Set-Cookie:
              description: The clearing session cookie (multi-user mode only).
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReport"
        "409":
          description: An import is in progress — wait for it to finish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/session:
    get:
      operationId: getAuthSession
      summary: Who is signed in, and whether sign-in exists at all
      description: >
        The one auth read the web app needs (phase 13 BRIEF §2). mode "off"
        is the authless single-user reference: no sign-in surface should be
        rendered anywhere. mode "oidc" with signed_in false is the signed-out
        state of a multi-user instance.
      responses:
        "200":
          description: The session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /auth/signin:
    get:
      operationId: startSignIn
      summary: Begin the OIDC sign-in redirect dance
      description: >
        Issues the provider redirect with a fresh state+nonce pair, carried
        in a short-lived HttpOnly cookie the callback verifies. A browser
        navigation target, not an API call — the generated client never
        invokes it.
      responses:
        "302":
          description: Redirect to the configured OIDC provider.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The state cookie (10 minutes, HttpOnly).
              schema: {type: string}
        "409":
          description: This instance runs authless (mode off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/callback:
    get:
      operationId: completeSignIn
      summary: OIDC provider redirect target
      description: >
        Exchanges the provider's code (server-to-server, with the client
        secret), verifies the ID token and nonce, upserts the user by
        subject, and mints an opaque session recorded in Postgres — the
        cookie carries the token, the table its hash.
      parameters:
        - name: code
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
        - name: error
          in: query
          description: Provider-reported failure (user denied, etc.).
          schema: {type: string}
      responses:
        "302":
          description: Signed in; back to the app.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Lax).
              schema: {type: string}
        "400":
          description: State mismatch, missing code, or a token that does not verify.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This instance runs authless (mode off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/signout:
    post:
      operationId: signOut
      summary: End the session
      description: >
        Deletes the session row (revocation is a DELETE, observable — the
        sessions-in-Postgres decision) and clears the cookie. Signed-out or
        mode-off callers get the same 204: the goal is absence.
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              description: The clearing cookie.
              schema: {type: string}

components:
  responses:
    Unauthorized:
      description: >
        No valid session (multi-user mode only; an authless instance never
        answers this). The web app treats it as "show the sign-in page."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Import:
      type: object
      required:
        [id, source_label, imported_at, visits, activities, points,
         raw_positions, skipped, status]
      properties:
        id:
          type: integer
          format: int64
        source_label:
          type: string
          description: Provenance label, defaulting to the source file name.
        window_start:
          type: string
          format: date-time
          description: Optional import date window (the -from flag). Absent means unbounded.
        window_end:
          type: string
          format: date-time
        imported_at:
          type: string
          format: date-time
        visits:
          type: integer
        activities:
          type: integer
        points:
          type: integer
        raw_positions:
          type: integer
        skipped:
          type: integer
        status:
          type: string
          enum: [running, completed, failed]
        error:
          type: string
          description: >
            The user-facing failure message — prose, subject to rewording;
            never the queryable evidence.
        detected_format:
          type: string
          description: >
            The sniffer's stable format label (phone-timeline, records-json,
            semantic-history, …). Absent when the input was never recognised.
        inserted:
          type: integer
          description: >
            How many observations were genuinely new — the per-type counters
            record what the file contained; this records what the database
            gained. Zero on a duplicate upload ("nothing new"). Absent on
            rows from before this field existed.
        content_hash:
          type: string
          description: >
            SHA-256 of the uploaded file, upload-path imports only — the
            retained file's name in the uploads directory (the photos
            content-hash precedent). Absent on CLI imports.
        detect_status:
          type: string
          enum: [running, completed, failed]
          description: >
            Status of the automatic detection that follows a successful
            upload import (phase 7 BRIEF §3D). Absent when no auto-detect
            was triggered (CLI imports, failed imports). A detection
            failure never marks the import failed — the import row
            describes the import.

    ImportRejection:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: The sniffer's actionable message — prose, rewordable.
        detected_format:
          type: string
          description: >
            The stable format label (zip, records-json, …) — what the file
            actually is, for mapping to a walkthrough anchor. Absent when
            the input was not recognisable at all.

    ImportList:
      type: object
      required: [imports]
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/Import"

    PhotoImportResult:
      type: object
      required: [import, files]
      properties:
        import:
          $ref: "#/components/schemas/Import"
        files:
          type: array
          items:
            $ref: "#/components/schemas/PhotoImportFile"

    PhotoImportFile:
      type: object
      required: [file, status]
      properties:
        file:
          type: string
        status:
          type: string
          enum: [fix, no_position, no_time, sidecar_paired, sidecar_unpaired, unsupported]
          description: >
            What this file contributed. "fix" — a position fix was extracted
            (with a photo record, and a thumbnail where decodable);
            "no_position"/"no_time" — a recognised photo carrying no usable
            reading (photos are stored only when they place something);
            sidecar verdicts mirror the phase-4 upload; "unsupported"
            carries the sniffer's actionable message.
        message:
          type: string
          description: Prose for rejected files — rewordable, never the label.

    LatLng:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    ModeCount:
      type: object
      required: [mode, n]
      properties:
        mode:
          type: string
          description: Google's mode guess, e.g. IN_PASSENGER_VEHICLE. Unreliable at extremes.
        n:
          type: integer

    Run:
      type: object
      required: [id, ran_at, params, outliers_dropped]
      properties:
        id:
          type: integer
          format: int64
        ran_at:
          type: string
          format: date-time
        params:
          type: object
          additionalProperties: true
          description: Exactly the parameters that produced this run (invariant 3).
        outliers_dropped:
          type: integer

    Candidate:
      type: object
      required:
        [id, span_start, span_end, days, dest, dest_km, track_km, stops,
         repeat, obs_count, start_truncated, end_truncated, modes]
      properties:
        id:
          type: integer
          format: int64
        span_start:
          type: string
          format: date-time
        span_end:
          type: string
          format: date-time
        days:
          type: number
          format: double
        dest:
          $ref: "#/components/schemas/LatLng"
        dest_km:
          type: integer
          description: Distance home → farthest place dwelt, never merely passed through.
        track_km:
          type: integer
        stops:
          type: integer
        repeat:
          type: integer
        obs_count:
          type: integer
        start_truncated:
          type: boolean
          description: The span begins at the window edge; the real journey started earlier (bug 4).
        end_truncated:
          type: boolean
        modes:
          type: array
          items:
            $ref: "#/components/schemas/ModeCount"
        score:
          type: number
          format: double
          description: >
            Confidence 0–100 from named weighted components (weights recorded
            in the run's params). Ranking and decision support only — never a
            filter, never auto-confirmation. Absent on candidates stored
            before scoring existed: not scored is different information than
            a low score.
        score_breakdown:
          type: array
          description: The per-component arithmetic that reproduces `score`.
          items:
            $ref: "#/components/schemas/ScoreComponent"
        decision:
          $ref: "#/components/schemas/Decision"

    ScoreComponent:
      type: object
      required: [name, present, weight, raw, unit, normalized, contribution]
      properties:
        name:
          type: string
          description: e.g. distance_from_home, destination_dwell.
        present:
          type: boolean
          description: >
            False when the component could not be computed; its weight was
            redistributed across the rest, never scored as zero.
        weight:
          type: number
          format: double
          description: Configured weight, before any redistribution.
        raw:
          type: number
          format: double
          description: Measured value in `unit`; 0 when not present.
        unit:
          type: string
        normalized:
          type: number
          format: double
          description: Raw scaled against its saturation anchor, clamped to [0,1].
        contribution:
          type: number
          format: double
          description: Points contributed to the 0–100 score; contributions sum to it.

    NameSuggestion:
      type: object
      required: [source]
      properties:
        name:
          type: string
          description: Absent when there is nothing to suggest.
        source:
          type: string
          description: Which suggester answered — "none" for the null implementation.

    Decision:
      type: object
      required: [id, action, updated_at]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          enum: [confirmed, dismissed]
        name:
          type: string
          description: Present when action is confirmed.
        updated_at:
          type: string
          format: date-time

    CandidateList:
      type: object
      required: [candidates, orphaned_decisions]
      properties:
        run:
          $ref: "#/components/schemas/Run"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        orphaned_decisions:
          type: array
          description: >
            Decisions no current candidate matched. Never hidden: a parameter
            change may orphan a decision, and lowering it back re-matches.
          items:
            $ref: "#/components/schemas/Decision"

    DecisionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [confirmed, dismissed]
        name:
          type: string
          description: Required when action is confirmed.

    TimedPoint:
      type: object
      required: [t, lat, lon]
      properties:
        t:
          type: string
          format: date-time
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    Leg:
      type: object
      required: [kind, points, distance_km, start, end]
      properties:
        kind:
          type: string
          enum: [observed, gap]
        gap_kind:
          type: string
          enum: [unknown, road, air]
          description: >
            Present only when kind is "gap". "air": the gap's implied speed
            (endpoint chord over duration) met the air_speed_min_kmh
            parameter — rendered as a great-circle arc, never routed,
            excluded from road-distance validation. "road": the routing
            cache supplied road geometry for this gap. "unknown": neither —
            drawn as a dashed straight line that is not a route.
        points:
          type: array
          description: >
            An observed leg carries its full point run; a gap leg carries
            exactly its two endpoints.
          items:
            $ref: "#/components/schemas/TimedPoint"
        distance_km:
          type: number
          format: double
          description: Chord sum for observed legs; endpoint chord for gaps.
        routed_points:
          type: array
          description: >
            Road geometry from the routing cache — present only when
            gap_kind is "road". Rides alongside points (which still holds
            exactly the two timestamped endpoints): routed vertices have no
            timestamps, and are inference, not measurement.
          items:
            $ref: "#/components/schemas/LatLng"
        routed_km:
          type: number
          format: double
          description: >
            The routed road distance — present only when gap_kind is
            "road". distance_km keeps its chord meaning regardless.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    Stop:
      type: object
      required: [start, end, loc, points, displacement_km]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        loc:
          $ref: "#/components/schemas/LatLng"
        points:
          type: integer
        displacement_km:
          type: number
          format: double
          description: First-to-last straight line during the halt, not path sum.

    Country:
      type: object
      required: [iso_code, name]
      properties:
        iso_code:
          type: string
          description: >
            ISO 3166-1 alpha-2 where Natural Earth provides one (Kosovo's XK
            is user-assigned); territories without any alpha-2 carry Natural
            Earth's three-letter ADM0_A3 instead.
        name:
          type: string

    State:
      type: object
      description: >
        An admin-1 region — state, province, région — from Natural Earth's
        1:10m file, the only scale that covers the world (phase 14 BRIEF §1).
      required: [code, name, country_code]
      properties:
        code:
          type: string
          description: Natural Earth's adm1_code — unique, where ISO 3166-2 is not.
        name:
          type: string
          description: >
            The local Latin-script name with its diacritics ("Vestfirðir",
            "Suðurland") — the name on the road sign, not the file's English
            gloss.
        country_code:
          type: string
          description: >
            Aligns with Country.iso_code by the same two-letter-else-ADM0_A3
            fallback; a label, not a join key.

    Journey:
      type: object
      required:
        [window_start, window_end, params, legs, stops, countries, states, summary, total_km,
         observed_km, inferred_km, air_km, unknown_km, routed_km, ground_km,
         google_km, google_ground_km, merged_points, trace_points_kept,
         raw_points_kept]
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        params:
          type: object
          additionalProperties: true
          description: Exactly the parameters that produced this assembly (invariant 3).
        legs:
          type: array
          items:
            $ref: "#/components/schemas/Leg"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
        countries:
          type: array
          description: >
            Countries the route's points fall in, ordered by first
            appearance along the journey. Derived locally by point-in-polygon
            against bundled Natural Earth polygons — never a network lookup.
            Empty when `roadbook countries` has not been run. Border-adjacent
            points can misattribute at 1:110m resolution; the UI labels this
            line as derived.
          items:
            $ref: "#/components/schemas/Country"
        states:
          type: array
          description: >
            Admin-1 regions the route's points fall in, ordered by first
            appearance along the journey — the same local point-in-polygon
            derivation as countries, against the embedded Natural Earth
            1:10m admin-1 polygons. Empty when `roadbook states` has not
            been run. Reproduction: `roadbook journey -candidate N`.
          items:
            $ref: "#/components/schemas/State"
        summary:
          $ref: "#/components/schemas/JourneySummary"
        total_km:
          type: number
          format: double
        observed_km:
          type: number
          format: double
        inferred_km:
          type: number
          format: double
        air_km:
          type: number
          format: double
          description: >
            Chord sum over air-classified gaps — a subset of inferred_km.
            The endpoint chord is the great-circle distance, so it is also
            the arc's length. Excluded from road-distance validation. 0 for
            a ground journey.
        unknown_km:
          type: number
          format: double
          description: >
            Chord sum over gaps still unknown after the routing cache was
            consulted — the visibly-unfilled remainder. A router that cannot
            fill a gap leaves it here by design (patchy OSM coverage is the
            expected case, not an error).
        routed_km:
          type: number
          format: double
          description: >
            Routed road distance summed over road legs. 0 when nothing is
            routed — the product is fully usable without a router.
        ground_km:
          type: number
          format: double
          description: >
            The road-comparable reconstruction: observed + routed + unknown
            chords. Air legs are excluded by construction.
        google_ground_km:
          type: number
          format: double
          description: >
            Google's own activity distances minus FLYING-mode activities —
            the comparable side of the road validation. Air must leave both
            sides or neither. Mode is a guess: a flight Google mislabelled
            as ground inflates this figure, and the divergence flag is the
            tripwire that surfaces it.
        mode_breakdown:
          type: array
          description: >
            Source-asserted per-mode distance (phase 11 §6.2): the window's
            activity distances summed by Google's own mode labels, ordered
            km-descending. These are the source's guesses (recorded
            failures: a 1,023 km "motorcycling" relocation, probability-0.00
            modes; the pipeline itself trusts speed over mode for flight),
            so display keeps them visually subordinate, labels the source,
            and never sums them against measured geometry. Absent — not
            empty — when the journey's evidence carries no activities at
            all (photo-sourced journeys): the display states that rather
            than showing zeros.
          items:
            $ref: "#/components/schemas/ModeKm"
        divergence_pct:
          type: number
          format: double
          description: >
            Signed percentage by which ground_km differs from
            google_ground_km. Absent when Google recorded no ground
            distance in the window — nothing to compare is not zero
            divergence. A conversation starter, never a gate: unroutable
            gaps under-count, OSM detours over-count, and both explain
            themselves on the map.
        divergence_flagged:
          type: boolean
          description: >
            True when divergence_pct exceeds the divergence_warn_pct
            parameter (echoed in params) in either direction. Absent
            whenever divergence_pct is absent. Computed server-side so the
            frontend renders the flag without owning the threshold.
        google_km:
          type: number
          format: double
          description: >
            Google's own distance figure summed over the window's activities —
            the independent check routed distance is validated against in
            phase 3. 0 when the window holds no activities.
        merged_points:
          type: integer
        trace_points_kept:
          type: integer
        raw_points_kept:
          type: integer

    Photo:
      type: object
      required:
        [id, original_name, time_source, pos_source, thumb_w, thumb_h,
         uploaded_at]
      properties:
        id:
          type: integer
          format: int64
        original_name:
          type: string
        taken_at:
          type: string
          format: date-time
          description: >
            The resolved capture instant. Absent when no rung of the time
            ladder resolved (time_source "none") — the photo is stored and
            shown, but unplaced on map and timeline.
        taken_offset_sec:
          type: integer
          description: >
            Civil offset for display, seconds east of UTC. Present exactly
            when taken_at is.
        time_source:
          type: string
          enum: [gps, exif_offset, sidecar, exif_local, none]
          description: >
            Which rung of the resolution ladder produced taken_at (BRIEF
            §3E), strongest first — the GPS receiver's own UTC clock, the
            explicit EXIF offset tag, the Takeout sidecar's epoch, or the
            wall clock interpreted in the adventure's own offset (stated as
            the weakest rung; wrong by the zone difference on multi-zone
            adventures).
        pos:
          $ref: "#/components/schemas/LatLng"
        pos_source:
          type: string
          enum: [exif, sidecar, none]
          description: >
            Which reading produced pos (BRIEF §3D) — the camera's own GPS
            block, or Google's copy from the Takeout sidecar. "none": no
            position; the photo appears in the strip but not on the map.
        thumb_w:
          type: integer
          description: Thumbnail pixel width, post-orientation.
        thumb_h:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        place_kind:
          type: string
          enum: [observed, road, unknown, air, stop]
          description: >
            Which element of the journey held this photo's instant — and
            therefore which drawn geometry distance_from_route_m was
            measured against (BRIEF §3G) - an observed leg's measured
            points, a road gap's routed polyline, an unknown gap's chord, or
            a stop's location. Absent when the photo is unplaced: no
            position, no resolved instant, or an instant outside every leg
            and stop. Derived at read time, never stored — re-detection
            re-places photos automatically.
        leg_index:
          type: integer
          description: Index into the journey's legs. Present for leg place kinds.
        stop_index:
          type: integer
          description: Index into the journey's stops. Present when place_kind is "stop".
        distance_from_route_m:
          type: number
          format: double
          description: >
            Point-to-polyline distance from the photo's position to the
            placed element's drawn geometry. Absent for place_kind "air":
            the arc is presentation between two endpoints, not a claimed
            path, so "far from it" asserts nothing.
        far_flagged:
          type: boolean
          description: >
            True when distance_from_route_m exceeds the photo_far_warn_m
            parameter (echoed in the list's params). The photo's position
            is a measurement — the most accurate in the project — so the
            flag marks a disagreement between the photo and the inferred
            route, not a doubt about the photo. A conversation starter,
            never a gate.

    BulkDecisionItem:
      type: object
      required: [id, action]
      properties:
        id:
          type: integer
          format: int64
          description: Candidate id from the latest run.
        action:
          type: string
          enum: [confirmed, dismissed]
        name:
          type: string
          description: Required, non-empty, when action is "confirmed".

    BulkDecisionRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/BulkDecisionItem"

    BulkDecisionResult:
      type: object
      required: [decided]
      properties:
        decided:
          type: integer
          description: How many decisions were applied (equals the request's count).

    ModeKm:
      type: object
      required: [mode, km, hours]
      properties:
        mode:
          type: string
          description: The source's own label (IN_BUS, FLYING, …), unreworded.
        km:
          type: number
          format: double
        hours:
          type: number
          format: double
          description: >
            The activity records' own start-to-end spans, summed whole
            (phase 14 CP2) — the same kind of claim as km: the source's
            assertion of time in transit, never a measured duration.

    JourneySummary:
      type: object
      description: >
        The journey summary (phase 14 BRIEF §2a): derived figures beside the
        assembly, every one printed identically by
        `roadbook journey -candidate N`. Measured figures only; the
        source-asserted per-mode time rides on mode_breakdown.
      required: [span_hours, civil_days, stops, dwell_hours]
      properties:
        span_hours:
          type: number
          format: double
          description: Window end minus start — time away. A truncated window is a truncated span.
        civil_days:
          type: integer
          description: >
            Civil dates touched, each timestamp in its own recorded offset:
            the earliest to the latest date among window edges, leg
            endpoints, and stop endpoints, inclusive — the narrative's day
            count, by the same rule.
        stops:
          type: integer
        dwell_hours:
          type: number
          format: double
          description: Summed duration of the reported stops.
        observed_hours:
          type: number
          format: double
          description: >
            Summed duration of moving observed legs (more than one point,
            non-zero distance — a fix is not a stretch). Present exactly
            when observed_pace_kmh is.
        observed_pace_kmh:
          type: number
          format: double
          description: >
            Observed km over observed hours — the average pace across
            recorded stretches only. Pauses shorter than the assembly's
            gap_threshold_minutes sit inside an observed leg and are
            included (the display names that parameter); gaps of every
            kind are excluded. Absent when no moving observed leg exists
            (a fix-only journey) — absent, never zero.

    ImportPhoto:
      type: object
      required:
        [id, import_id, original_name, taken_at, taken_offset_sec,
         time_source, pos, pos_source, thumb_w, thumb_h, uploaded_at]
      description: >
        One photo-import record (phase 11 §4D), distinct from Photo
        deliberately: records ride imports and are never deletable from an
        adventure, while attached photos ride decisions and are — one schema
        for both would blur what each id can do. Records exist only for
        usable photos, so position and instant are always present.
      properties:
        id:
          type: integer
          format: int64
        import_id:
          type: integer
          format: int64
          description: The photo import this record arrived in.
        original_name:
          type: string
        taken_at:
          type: string
          format: date-time
        taken_offset_sec:
          type: integer
          description: Civil offset for display, seconds east of UTC.
        time_source:
          type: string
          enum: [gps, exif_offset, sidecar, exif_local]
        pos:
          $ref: "#/components/schemas/LatLng"
        pos_source:
          type: string
          enum: [exif, sidecar]
        thumb_w:
          type: integer
          description: Thumbnail pixel width; 0 means no thumbnail (HEIC).
        thumb_h:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        place_kind:
          type: string
          enum: [observed, road, unknown, air, stop]
          description: >
            Same read-time placement as Photo.place_kind, against the same
            drawn geometry. Absent when the instant falls outside every leg
            and stop of the assembled journey.
        leg_index:
          type: integer
        stop_index:
          type: integer
        distance_from_route_m:
          type: number
          format: double
        far_flagged:
          type: boolean

    ImportPhotoList:
      type: object
      required: [photos, params]
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ImportPhoto"
        params:
          type: object
          additionalProperties: true
          description: >
            The placement parameters that produced the derived fields
            (invariant 3) — photo_far_warn_m today.

    PhotoUploadResult:
      type: object
      required: [file, status]
      properties:
        file:
          type: string
          description: The uploaded filename this result is about.
        status:
          type: string
          enum: [accepted, duplicate, rejected, sidecar_paired, sidecar_unpaired]
          description: >
            accepted — stored, thumbnail written. duplicate — identical
            bytes already stored (the existing photo is returned).
            rejected — not a supported photo; reason says what it actually
            is and what to do. sidecar_paired — a Takeout JSON consumed as
            metadata for paired_with. sidecar_unpaired — a sidecar naming
            no image in this upload; nothing stored.
        reason:
          type: string
          description: The actionable rejection message. Present when rejected.
        paired_with:
          type: string
          description: The image filename a sidecar was applied to.
        photo:
          $ref: "#/components/schemas/Photo"

    PhotoUploadResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PhotoUploadResult"

    PhotoList:
      type: object
      required: [photos, params]
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        params:
          type: object
          additionalProperties: true
          description: >
            The placement parameters that produced the derived fields
            (invariant 3) — photo_far_warn_m today.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SessionInfo:
      type: object
      required: [mode, signed_in]
      properties:
        mode:
          type: string
          enum: [off, oidc]
          x-enum-varnames: [AuthModeOff, AuthModeOIDC]
        signed_in:
          type: boolean
        email:
          type: string
          description: Present only when signed in and the provider shared one.

    ShareLink:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    ShareLinkCreated:
      type: object
      required: [id, created_at, token]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: >
            The raw 128-bit token, hex. Returned exactly once; the server
            stores only its hash. The web app composes the URL as
            /shared/{token} on whatever origin it is served from — the
            API never assumes a public origin.

    ShareLinkList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareLink"

    SharedAdventure:
      type: object
      description: >
        Everything the shared plate renders, and nothing about the owner:
        no candidate id, no score, no account. The photo entries' ids are
        meaningful only through the token-scoped thumbnail operations.
      required:
        [name, span_start, span_end, start_truncated, end_truncated, journey,
         photos, import_photos, params]
      properties:
        name:
          type: string
          description: The adventure's confirmed name.
        span_start:
          type: string
          format: date-time
        span_end:
          type: string
          format: date-time
        start_truncated:
          type: boolean
        end_truncated:
          type: boolean
        journey:
          $ref: "#/components/schemas/Journey"
        photos:
          type: array
          description: Photos attached to the adventure, with placements.
          items:
            $ref: "#/components/schemas/Photo"
        import_photos:
          type: array
          description: Photo-import records span-joined to the adventure, with placements.
          items:
            $ref: "#/components/schemas/ImportPhoto"
        params:
          type: object
          additionalProperties: true
          description: The photo placement parameters (invariant 3) — photo_far_warn_m.

    DeletionReport:
      type: object
      required: [rows, thumbnails_removed, uploads_removed]
      properties:
        rows:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Rows deleted, by table.
        thumbnails_removed:
          type: integer
          description: Thumbnail files removed (those no remaining row referenced).
        uploads_removed:
          type: integer
          description: Retained upload files removed (same rule).
