# Test database for `make test` — used by scripts/test.sh only when no local
# Postgres answers (the usual dev machine has one; this covers machines that
# don't). PostGIS image because migration 00003 creates the extension.
# Nothing here runs in production; phase 5 owns the deploy compose file.
services:
  testdb:
    # Same image as compose.yaml's db: imresamu/postgis is the multi-arch
    # build of the official postgis image — postgis/postgis publishes no
    # arm64, so the previous image made this fallback fail on every ARM
    # machine (unnoticed: the usual dev machine has local Postgres).
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: roadbook
      POSTGRES_PASSWORD: roadbook
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadbook"]
      interval: 1s
      timeout: 3s
      retries: 30
